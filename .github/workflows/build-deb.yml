name: Build deb (self-hosted)

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter version to build
        required: true
        default: '3.44.0'
      arch:
        description: Target architecture
        required: true
        default: arm64
        type: choice
        options:
          - arm64
      runner_labels_json:
        description: JSON array for runs-on labels
        required: true
        default: '["self-hosted","linux"]'
      publish_release:
        description: Create/update the GitHub release after build
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag to publish when publish_release is true
        required: false
        default: v3.44.0

permissions:
  contents: write
  actions: read

concurrency:
  group: build-deb-${{ github.ref }}-${{ inputs.arch }}
  cancel-in-progress: false

jobs:
  build:
    name: Full Flutter/Termux deb build
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 720

    env:
      FLUTTER_VERSION: ${{ inputs.flutter_version }}
      ARCH: ${{ inputs.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Ensure depot_tools is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gclient >/dev/null 2>&1; then
            git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
            echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"
          fi

      - name: Validate host toolchain contract
        shell: bash
        run: |
          set -euo pipefail
          test -d /opt/android-ndk-r27d || { echo "Missing /opt/android-ndk-r27d" >&2; exit 1; }
          grep -q "tag = '${FLUTTER_VERSION}'" build.toml || {
            echo "build.toml Flutter tag does not match workflow input ${FLUTTER_VERSION}" >&2
            exit 1
          }
          python -m py_compile build.py package.py sysroot.py utils.py
          bash -n scripts/install/post_install.sh
          python scripts/ci/check_repo.py

      - name: Clone Flutter SDK
        run: python3 build.py clone

      - name: Sync engine dependencies
        run: python3 build.py sync

      - name: Apply patches
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py patch_engine
          python3 build.py patch_dart
          python3 build.py patch_skia
          python3 build.py patch_flutter_sdk

      - name: Build all artifacts
        run: python3 build.py build_all --arch="$ARCH"

      - name: Package deb
        run: python3 build.py debuild --arch="$ARCH"

      - name: Collect artifact metadata
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          DEB="flutter_${FLUTTER_VERSION}_aarch64.deb"
          test -f "$DEB"
          sha256sum "$DEB" | tee "${DEB}.sha256"
          stat -c '%n %s bytes' "$DEB" | tee "${DEB}.size.txt"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-termux-${{ inputs.flutter_version }}-${{ inputs.arch }}
          path: |
            ${{ steps.artifact.outputs.deb }}
            ${{ steps.artifact.outputs.deb }}.sha256
            ${{ steps.artifact.outputs.deb }}.size.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub release
        if: inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null 2>&1 || { echo "gh CLI is required when publish_release=true" >&2; exit 1; }
          DEB="${{ steps.artifact.outputs.deb }}"
          TAG="${{ inputs.release_tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
            gh release edit "$TAG" --title "Flutter ${FLUTTER_VERSION} for Termux ARM64" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "$DEB" --target "$GITHUB_SHA" --title "Flutter ${FLUTTER_VERSION} for Termux ARM64" --notes-file RELEASE_NOTES.md --latest
          fi
