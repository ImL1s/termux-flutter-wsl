name: Release check

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (leave empty to use build.toml)"
        required: false
        default: ""
  release:
    types: [published, edited]

permissions:
  contents: read
  actions: read


jobs:
  release-metadata:
    name: Verify release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Lightweight check for PRs to verify manifest resolution and hash mismatch logic
            export LIGHTWEIGHT_CHECK=1
          fi
          python scripts/ci/verify_release_asset.py
