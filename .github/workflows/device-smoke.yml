name: Device smoke (self-hosted)

on:
  workflow_dispatch:
    inputs:
      runner_labels_json:
        description: JSON array for runs-on labels. Use a Windows runner connected to the tablet by ADB.
        required: true
        default: '["self-hosted","windows"]'
      adb_path:
        description: Full adb path, or adb if it is on PATH
        required: true
        default: adb
      device_serial:
        description: Optional adb serial
        required: false
        default: ''
      artifact_run_id:
        description: "Run ID of the build-deb workflow"
        required: true
      artifact_name:
        description: "Name of the artifact to download"
        required: true
      expected_sha256:
        description: Expected SHA256 for the deb under test
        required: true
      promote_release:
        description: "Promote to GitHub Release after successful smoke test"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Tag for the release (e.g. v3.44.2-termux)"
        required: false
      timeout_minutes:
        description: Device smoke timeout in minutes. Keep the tablet awake/unlocked before starting.
        required: true
        default: '45'

permissions:
  contents: write
  actions: read

concurrency:
  group: device-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Termux tablet smoke
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          gh run download "$ARTIFACT_RUN_ID" -n "$ARTIFACT_NAME" -D ./candidate
          ls -la ./candidate

      - name: Verify artifact SHA256
        shell: bash
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail

          mapfile -t DEBS < <(find ./candidate -type f -name '*.deb')
          mapfile -t SHAS < <(find ./candidate -type f -name '*.sha256')
          mapfile -t SIZES < <(find ./candidate -type f -name '*.size.txt')
          mapfile -t METADATAS < <(find ./candidate -type f -name 'build_metadata.json')
          mapfile -t INVENTORIES < <(find ./candidate -type f -name 'inventory.txt')

          if [ "${#DEBS[@]}" -ne 1 ]; then
            echo "Error: Ambiguous or missing candidate .deb file. Expected 1, found ${#DEBS[@]}" >&2
            exit 1
          fi
          if [ "${#SHAS[@]}" -ne 1 ]; then
            echo "Error: Ambiguous or missing candidate .sha256 file. Expected 1, found ${#SHAS[@]}" >&2
            exit 1
          fi
          if [ "${#SIZES[@]}" -ne 1 ]; then
            echo "Error: Ambiguous or missing candidate .size.txt file. Expected 1, found ${#SIZES[@]}" >&2
            exit 1
          fi
          if [ "${#METADATAS[@]}" -ne 1 ]; then
            echo "Error: Ambiguous or missing candidate build_metadata.json file. Expected 1, found ${#METADATAS[@]}" >&2
            exit 1
          fi
          if [ "${#INVENTORIES[@]}" -ne 1 ]; then
            echo "Error: Ambiguous or missing candidate inventory.txt file. Expected 1, found ${#INVENTORIES[@]}" >&2
            exit 1
          fi

          DEB="${DEBS[0]}"
          SHA_FILE="${SHAS[0]}"
          SIZE_FILE="${SIZES[0]}"
          METADATA="${METADATAS[0]}"
          INVENTORY="${INVENTORIES[0]}"

          ACTUAL_SHA=$(sha256sum "$DEB" | awk '{print $1}')
          ACTUAL_SIZE=$(stat -c%s "$DEB" 2>/dev/null || stat -f%z "$DEB")
          EXPECTED_CLEAN=$(echo "$EXPECTED_SHA256" | tr '[:upper:]' '[:lower:]' | xargs)
          if [ "$ACTUAL_SHA" != "$EXPECTED_CLEAN" ]; then
            echo "SHA256 MISMATCH: expected $EXPECTED_CLEAN, got $ACTUAL_SHA" >&2
            exit 1
          fi

          # 1. Companion .sha256 file content
          SHA_FILE_CONTENT=$(cat "$SHA_FILE" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')
          if [ "$SHA_FILE_CONTENT" != "$ACTUAL_SHA" ]; then
            echo "Error: Companion .sha256 content ($SHA_FILE_CONTENT) != actual deb SHA256 ($ACTUAL_SHA)" >&2
            exit 1
          fi

          # 2. Companion .size.txt file content
          SIZE_FILE_CONTENT=$(cat "$SIZE_FILE" | tr -d '[:space:]')
          if [ "$SIZE_FILE_CONTENT" != "$ACTUAL_SIZE" ]; then
            echo "Error: Companion .size.txt content ($SIZE_FILE_CONTENT) != actual deb size ($ACTUAL_SIZE)" >&2
            exit 1
          fi

          # 3-6. Metadata fields verification
          META_SHA=$(python3 -c "import json; v=json.load(open('$METADATA')).get('sha256',''); print(v.lower().strip())")
          META_SIZE=$(python3 -c "import json; print(json.load(open('$METADATA')).get('size_bytes',''))")
          META_RUN_ID=$(python3 -c "import json; print(json.load(open('$METADATA')).get('run_id',''))")
          META_COMMIT=$(python3 -c "import json; v=json.load(open('$METADATA')).get('source_commit'); print(v if v is not None else '')")

          if [ "$META_SHA" != "$ACTUAL_SHA" ]; then
            echo "Error: build_metadata.json sha256 ($META_SHA) != actual deb SHA256 ($ACTUAL_SHA)" >&2
            exit 1
          fi

          if [ "$META_SIZE" != "$ACTUAL_SIZE" ]; then
            echo "Error: build_metadata.json size_bytes ($META_SIZE) != actual deb size ($ACTUAL_SIZE)" >&2
            exit 1
          fi

          if [ -n "$ARTIFACT_RUN_ID" ] && [ "$META_RUN_ID" != "$ARTIFACT_RUN_ID" ]; then
            echo "Error: build_metadata.json run_id ($META_RUN_ID) != artifact_run_id ($ARTIFACT_RUN_ID)" >&2
            exit 1
          fi

          ARTIFACT_SOURCE_COMMIT=$(python3 -c "import json; v=json.load(open('$METADATA')).get('source_commit',''); print(v.lower().strip())")
          VERIFIER_COMMIT=$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]' | xargs)

          if ! echo "$ARTIFACT_SOURCE_COMMIT" | grep -E -q '^[0-9a-f]{40}$'; then
            echo "Error: artifact_source_commit ($ARTIFACT_SOURCE_COMMIT) is not a valid 40-hex commit" >&2
            exit 1
          fi

          if ! echo "$VERIFIER_COMMIT" | grep -E -q '^[0-9a-f]{40}$'; then
            echo "Error: verifier_commit ($VERIFIER_COMMIT) is not a valid 40-hex commit" >&2
            exit 1
          fi

          if [ "$ARTIFACT_SOURCE_COMMIT" != "$VERIFIER_COMMIT" ]; then
            echo "Error: Commit mismatch! artifact_source_commit ($ARTIFACT_SOURCE_COMMIT) != verifier_commit ($VERIFIER_COMMIT)" >&2
            exit 1
          fi

          echo "RESOLVED_DEB=$DEB" >> $GITHUB_ENV
          echo "RESOLVED_SHA_FILE=$SHA_FILE" >> $GITHUB_ENV
          echo "RESOLVED_SIZE_FILE=$SIZE_FILE" >> $GITHUB_ENV
          echo "RESOLVED_METADATA=$METADATA" >> $GITHUB_ENV
          echo "RESOLVED_INVENTORY=$INVENTORY" >> $GITHUB_ENV
          echo "ARTIFACT_SOURCE_COMMIT=$ARTIFACT_SOURCE_COMMIT" >> $GITHUB_ENV
          echo "VERIFIER_COMMIT=$VERIFIER_COMMIT" >> $GITHUB_ENV
          echo "✓ Candidate set cryptographically bound and verified: DEB=$DEB, SHA256=$ACTUAL_SHA, COMMIT=$ARTIFACT_SOURCE_COMMIT"

      - name: Run Termux smoke through ADB
        shell: pwsh
        env:
          INPUT_ADB_PATH: ${{ inputs.adb_path }}
          INPUT_DEVICE_SERIAL: ${{ inputs.device_serial }}
          INPUT_EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          RESOLVED_DEB: ${{ env.RESOLVED_DEB }}
          ARTIFACT_SOURCE_COMMIT: ${{ env.ARTIFACT_SOURCE_COMMIT }}
          VERIFIER_COMMIT: ${{ env.VERIFIER_COMMIT }}
        run: |
          $ErrorActionPreference = 'Stop'
          scripts/device/run_termux_smoke.ps1 `
            -AdbPath $env:INPUT_ADB_PATH `
            -DeviceSerial $env:INPUT_DEVICE_SERIAL `
            -DebPath $env:RESOLVED_DEB `
            -ExpectedSha256 $env:INPUT_EXPECTED_SHA256 `
            -TimeoutMinutes $env:INPUT_TIMEOUT_MINUTES `
            -ArtifactSourceCommit "$env:ARTIFACT_SOURCE_COMMIT" `
            -VerifierCommit "$env:VERIFIER_COMMIT"

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-smoke-evidence
          path: evidence.json
          if-no-files-found: error

      - name: Promote Release
        if: inputs.promote_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          RESOLVED_DEB: ${{ env.RESOLVED_DEB }}
          RESOLVED_SHA_FILE: ${{ env.RESOLVED_SHA_FILE }}
          RESOLVED_SIZE_FILE: ${{ env.RESOLVED_SIZE_FILE }}
          RESOLVED_METADATA: ${{ env.RESOLVED_METADATA }}
          RESOLVED_INVENTORY: ${{ env.RESOLVED_INVENTORY }}
          ARTIFACT_SOURCE_COMMIT: ${{ env.ARTIFACT_SOURCE_COMMIT }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null 2>&1 || { echo "gh CLI is required" >&2; exit 1; }

          TAG="$INPUT_RELEASE_TAG"
          if [ -z "$TAG" ]; then
            echo "release_tag is required for promotion" >&2
            exit 1
          fi

          if [ ! -f evidence.json ]; then
            echo "Error: evidence.json missing. Cannot promote." >&2
            exit 1
          fi

          EV_STATUS=$(python3 -c "import json; print(json.load(open('evidence.json')).get('status', 'failed'))")
          MODE_B_STATUS=$(python3 -c "import json; print(json.load(open('evidence.json')).get('mode_b_status', 'failed'))")
          EV_ART_COMMIT=$(python3 -c "import json; print(json.load(open('evidence.json')).get('artifact_source_commit', ''))")
          EV_VER_COMMIT=$(python3 -c "import json; print(json.load(open('evidence.json')).get('verifier_commit', ''))")

          DEB_SHA=$(python3 -c "import json; print(json.load(open('evidence.json')).get('artifacts', {}).get('deb_sha256', ''))")
          DEB_SZ=$(python3 -c "import json; print(json.load(open('evidence.json')).get('artifacts', {}).get('deb_size', 0))")

          APK_SHA=$(python3 -c "import json; print(json.load(open('evidence.json')).get('artifacts', {}).get('apk_sha256', ''))")
          APK_SZ=$(python3 -c "import json; print(json.load(open('evidence.json')).get('artifacts', {}).get('apk_size', 0))")

          AAB_SHA=$(python3 -c "import json; print(json.load(open('evidence.json')).get('artifacts', {}).get('aab_sha256', ''))")
          AAB_SZ=$(python3 -c "import json; print(json.load(open('evidence.json')).get('artifacts', {}).get('aab_size', 0))")

          if [ "$EV_STATUS" != "passed" ] || [ "$MODE_B_STATUS" != "passed" ]; then
            echo "Error: Promotion rejected! Evidence status is '$EV_STATUS' and mode_b_status is '$MODE_B_STATUS' (both must be 'passed')" >&2
            exit 1
          fi

          if [ "$EV_ART_COMMIT" != "$EV_VER_COMMIT" ] || [ -z "$EV_ART_COMMIT" ]; then
            echo "Error: Promotion rejected! artifact_source_commit ($EV_ART_COMMIT) != verifier_commit ($EV_VER_COMMIT)" >&2
            exit 1
          fi

          if ! echo "$DEB_SHA" | grep -E -q '^[0-9a-f]{64}$' || [ "$DEB_SZ" -le 0 ]; then
            echo "Error: Promotion rejected! Invalid DEB artifact evidence: SHA=$DEB_SHA, size=$DEB_SZ" >&2
            exit 1
          fi

          if ! echo "$APK_SHA" | grep -E -q '^[0-9a-f]{64}$' || [ "$APK_SZ" -le 0 ]; then
            echo "Error: Promotion rejected! Invalid APK artifact evidence: SHA=$APK_SHA, size=$APK_SZ" >&2
            exit 1
          fi

          if ! echo "$AAB_SHA" | grep -E -q '^[0-9a-f]{64}$' || [ "$AAB_SZ" -le 0 ]; then
            echo "Error: Promotion rejected! Invalid AAB artifact evidence: SHA=$AAB_SHA, size=$AAB_SZ" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Cannot clobber existing published assets." >&2
            exit 1
          fi

          NOTES_FILE="docs/releases/RELEASE_NOTES.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE=""
          fi

          SOURCE_COMMIT="${ARTIFACT_SOURCE_COMMIT:-$EV_ART_COMMIT}"
          if [ -z "$SOURCE_COMMIT" ]; then
            echo "Error: source_commit is required" >&2
            exit 1
          fi

          RELEASE_ARGS=(
            "$TAG"
            "$RESOLVED_DEB"
            "$RESOLVED_SHA_FILE"
            "$RESOLVED_SIZE_FILE"
            "$RESOLVED_METADATA"
            "$RESOLVED_INVENTORY"
            "--target" "$SOURCE_COMMIT"
            "--title" "Flutter Termux $TAG"
          )
          if [ -n "$NOTES_FILE" ]; then
            RELEASE_ARGS+=("--notes-file" "$NOTES_FILE")
          fi

          gh release create "${RELEASE_ARGS[@]}"
