[flutter]
tag = '3.44.9'
release_tag = 'v3.44.9-termux-1'
revision = '1'
dart_version = '3.12.2'
engine_commit = '5a2a6a42cce67f965cf540fcecf616faca624aa1'
framework_revision = '6b182d2c7585eba26d4edce0f97630effd256c33'
framework_commit_date = '2026-08-05 17:04:07 +0000'
devtools_version = '2.42.0'
sha256 = 'ca2cb4de90e657db5445ea3142bfdc71e6be511da8f56b8cdfd9eb49d71ac6b0'
size = 178490900
asset_name = 'flutter_3.44.9-1_aarch64.deb'
repo = 'https://github.com/flutter/flutter'
path = './flutter'

[ndk]
api = 35 # Android 16 = API 35
path = ''

[build]
arch = ['arm64'] # arm, arm64, x86, x64
runtime = ['debug'] # debug, release, profile
gclient = './.gclient'
root = './engine'
release = './release'
jobs = 24  # Ryzen 9950X3D: 32 threads, leave 8 for system

# Windows to WSL sync paths (for debuild)
[sync]
windows_root = ''
wsl_root = ''
paths = ['scripts', 'patches', 'package.yaml', 'build.toml', 'build.py', 'sysroot.py', 'package.py', 'utils.py', '.gclient', 'install_flutter_complete.sh', 'sysroot.lock.json']

# Patches are now version-based: patches/{version}/*.patch
# build.py will automatically look for patches in patches/{flutter.tag}/
[patch]
dir = './patches'  # Base directory for patches

[patch.engine]
file = 'engine.patch'
path = '.'

[patch.dart]
file = 'dart.patch'
path = 'engine/src/flutter/third_party/dart'

[patch.skia]
file = 'skia.patch'
path = 'engine/src/flutter/third_party/skia'

[patch.flutter_sdk]
file = 'flutter_sdk_arm64_default.patch'
path = '.'

[sysroot]
path = './sysroot'

[sysroot.termux-main]
repo = 'https://packages-cf.termux.dev/apt/termux-main/'
dist = 'stable'
pkgs = [
  'at-spi2-core',
  'brotli',
  'dbus',
  'fontconfig',
  'freetype',
  'fribidi',
  'gdk-pixbuf',
  'glib',
  'harfbuzz',
  'libcairo',
  'libepoxy',
  'libexpat',
  'libffi',
  'libglvnd',
  'libgraphite',
  'libjpeg-turbo',
  'liblzma',
  'libpixman',
  'libpng',
  'libtiff',
  'libwayland',
  'libx11',
  'libxau',
  'libxcb',
  'libxcursor',
  'libxdmcp',
  'libxext',
  'libxfixes',
  'libxft',
  'libxi',
  'libxrandr',
  'libxrender',
  'libxtst',
  'pango',
  'pcre2',
  'swiftshader',
  'xorgproto',
  'zlib',
  'zstd',
]

[sysroot.termux-x11]
repo = 'https://packages-cf.termux.dev/apt/termux-x11/'
dist = 'x11'
pkgs = [
  'gtk3',
  'libxcomposite',
  'libxdamage',
  'libxinerama',
  'libxkbcommon',
]

[package]
conf = './package.yaml'
path = '.'
